<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal - StarDX</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen">
    <div id="auth-box" class="w-full max-w-md p-8 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-blue-500">STAR<span class="text-white">DX</span> Portal</h2>
            <p class="text-sm text-slate-400 mt-1">Log in to manage your trading accounts</p>
        </div>
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs uppercase font-semibold text-slate-400 mb-2">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-blue-500 text-sm">
            </div>
            <div>
                <label class="block text-xs uppercase font-semibold text-slate-400 mb-2">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-blue-500 text-sm">
            </div>
            <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-semibold rounded-xl transition shadow-lg shadow-blue-600/30">Log In</button>
        </form>
    </div>

    <!-- Hidden Dashboard View (Loads on successful simulated login) -->
    <div id="dashboard-box" class="hidden w-full max-w-4xl p-8 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl">
        <div class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h2 class="text-2xl font-bold text-blue-500">Client Dashboard</h2>
                <p class="text-xs text-slate-400">Welcome back, Trader</p>
            </div>
            <button onclick="location.reload()" class="px-4 py-2 bg-red-600/20 text-red-400 text-xs font-semibold rounded-lg hover:bg-red-600/30 transition">Log Out</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="p-6 bg-slate-950 border border-slate-800 rounded-xl">
                <span class="text-xs text-slate-400 uppercase">Account Balance</span>
                <div class="text-3xl font-extrabold text-blue-400 mt-2">$5,928.03</div>
            </div>
            <div class="p-6 bg-slate-950 border border-slate-800 rounded-xl">
                <span class="text-xs text-slate-400 uppercase">Active Leverage</span>
                <div class="text-3xl font-extrabold text-green-400 mt-2">1:500</div>
            </div>
            <div class="p-6 bg-slate-950 border border-slate-800 rounded-xl">
                <span class="text-xs text-slate-400 uppercase">Deposit Method</span>
                <div class="text-lg font-bold text-slate-200 mt-2">UPI / Net Banking</div>
            </div>
        </div>
        <div class="p-6 bg-slate-950 border border-slate-800 rounded-xl">
            <h3 class="font-bold text-lg mb-4">Quick Deposit (Instant UPI)</h3>
            <div class="flex space-x-4">
                <input type="number" placeholder="Enter Amount in INR" class="px-4 py-2 bg-slate-900 border border-slate-800 rounded-lg text-sm flex-1">
                <button onclick="alert('Deposit request submitted! Awaiting admin approval.')" class="px-6 py-2 bg-blue-600 hover:bg-blue-500 font-semibold rounded-lg text-sm">Deposit Now</button>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            document.getElementById('auth-box').classList.add('hidden');
            document.getElementById('dashboard-box').classList.remove('hidden');
        }
    </script>
</body>
</html>
